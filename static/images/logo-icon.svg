<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#cyanGrad)" />
  
  <!-- Subtle inner concentric radar rings -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="50" cy="50" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Radar sweep beam -->
  <path d="M 50 50 L 74 26 A 34 34 0 0 0 50 16 Z" fill="url(#accentGrad)" fill-opacity="0.35" />

  <!-- Reverse Return Arrow / TraceBack Loop -->
  <path d="M 32 46 A 18 18 0 1 1 50 68 C 42 68 35 62 33 55" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Arrowhead on the trace loop -->
  <polygon points="26,45 36,36 38,49" fill="#ffffff" />

  <!-- Center Pinpoint AI Core -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3.5" fill="#0891b2" />

  <!-- Neural AI Nodes -->
  <circle cx="68" cy="38" r="3" fill="#22d3ee" />
  <line x1="55" y1="46" x2="66" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="34" cy="64" r="2.5" fill="#a5f3fc" />
</svg>
