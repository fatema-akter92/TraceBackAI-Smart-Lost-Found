<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Icon Section (Left) -->
  <g transform="translate(10, 10)">
    <!-- Squircle Container -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#logoCyanGrad)" />
    
    <!-- Concentric radar circles -->
    <circle cx="30" cy="30" r="22" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="2 2" />
    <circle cx="30" cy="30" r="15" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />

    <!-- Return Loop Arrow -->
    <path d="M 19 28 A 11 11 0 1 1 30 41 C 25 41 21 37 20 33" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="15,27 22,20 23,30" fill="#ffffff" />

    <!-- Center Pulse -->
    <circle cx="30" cy="30" r="3.5" fill="#ffffff" />
    <circle cx="30" cy="30" r="2" fill="#0891b2" />

    <!-- AI dot -->
    <circle cx="41" cy="22" r="2" fill="#67e8f9" />
    <line x1="33" y1="28" x2="40" y2="23" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7" />
  </g>

  <!-- Typography: TraceBack AI -->
  <!-- "Trace" -->
  <text x="82" y="44" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Trace</text>
  
  <!-- "Back" in Mid-Cyan -->
  <text x="156" y="44" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0891b2" letter-spacing="-0.5">Back</text>

  <!-- "AI" Badge -->
  <rect x="228" y="22" width="36" height="24" rx="7" fill="url(#aiBadgeGrad)" />
  <text x="246" y="39" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AI</text>

  <!-- Tagline Subtitle -->
  <text x="84" y="60" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.2">SMART RECOVERY NETWORK</text>
</svg>
