{% extends 'base.html' %}

{% block title %}File Complaint / Report Abuse | TraceBack BD{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-md p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-xl shadow-xs">
                <i class="fas fa-flag"></i>
            </div>
            <h1 class="text-xl font-extrabold text-slate-900">File a Report / Complaint</h1>
            {% if reported_item %}
            <p class="text-xs text-slate-500">Regarding item: <strong class="text-slate-800">{{ reported_item.title }}</strong></p>
            {% endif %}
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Issue Category *</label>
                <select name="complaint_type" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-cyan-500">
                    <option value="fake_report">Suspected Fake or Prank Report</option>
                    <option value="duplicate_spam">Duplicate Spam Posting</option>
                    <option value="false_claim">False Ownership Claim / Impersonator</option>
                    <option value="inappropriate">Inappropriate / Offensive Language or Photos</option>
                    <option value="other">Other Violation</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Details &amp; Explanation *</label>
                <textarea name="description" rows="4" required placeholder="Describe the violation with relevant evidence..." class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-cyan-500"></textarea>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-rose-600 text-white font-bold text-xs rounded-xl hover:bg-rose-700 transition">
                Submit Report to Moderation Team
            </button>
        </form>
    </div>
</div>
{% endblock %}
