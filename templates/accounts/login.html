{% extends 'base.html' %}

{% block title %}Sign In | TraceBack BD{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-md space-y-6">
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-cyan-100 text-cyan-700 flex items-center justify-center mx-auto text-xl mb-3 shadow-xs">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Sign in to TraceBack BD</h2>
            <p class="text-xs text-slate-500 mt-1">Access your lost reports, claim updates, and AI matches</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fas fa-user text-xs"></i>
                    </span>
                    <input type="text" name="username" required autofocus class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fas fa-key text-xs"></i>
                    </span>
                    <input type="password" name="password" required class="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-slate-300 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-200 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700 transition shadow-md shadow-cyan-600/30 flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100">
            <p class="text-xs text-slate-500">
                Don't have an account yet? 
                <a href="{% url 'register' %}" class="font-bold text-cyan-600 hover:text-cyan-800">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
